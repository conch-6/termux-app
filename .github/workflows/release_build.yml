name: Release Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android signing
        shell: bash {0}
        env:
          SIGNING_STORE_BASE64: ${{ secrets.TERMUX_SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TERMUX_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TERMUX_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TERMUX_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing signing secrets"; exit 1
          fi
          printf '%s' "$SIGNING_STORE_BASE64" | base64 -d > app/termux-signing.jks
          echo "TERMUX_SIGNING_STORE_FILE=termux-signing.jks" >> $GITHUB_ENV
          echo "TERMUX_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> $GITHUB_ENV
          echo "TERMUX_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> $GITHUB_ENV
          echo "TERMUX_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build release APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: apt-android-7
        run: |
          CURRENT_VERSION_NAME="$(grep -m 1 -E '\s+versionName "([^"]+)"$' ./app/build.gradle | sed -r 's/.*versionName "([^"]+)"$/\1/')"
          APK_VERSION_TAG="v${CURRENT_VERSION_NAME}+${GITHUB_SHA:0:7}-${PACKAGE_VARIANT}-release"
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          export TERMUX_APP_VERSION_NAME="$CURRENT_VERSION_NAME"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        shell: bash {0}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          APK_SIGNER=$(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner | tail -1)
          "$APK_SIGNER" verify --print-certs "$APK"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
